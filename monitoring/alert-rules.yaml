apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: argocd.rules
      rules:
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD application {{ $labels.name }} is Degraded"
            description: "Application {{ $labels.name }} (namespace {{ $labels.dest_namespace }}) has been Degraded for more than 2 minutes."
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD application {{ $labels.name }} is OutOfSync"
            description: "The live state of {{ $labels.name }} differs from Git for more than 2 minutes."
        - alert: ArgoCDSyncFailed
          expr: increase(argocd_app_sync_total{phase=~"Error|Failed"}[5m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Sync of {{ $labels.name }} failed"
            description: "At least one sync operation of {{ $labels.name }} ended in phase {{ $labels.phase }} in the last 5 minutes."
    - name: workload.rules
      rules:
        - alert: PodImagePullBackOff
          expr: max by (namespace, pod, container, reason) (kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff"}) == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image"
            description: "Container {{ $labels.container }} is stuck in {{ $labels.reason }} for more than 1 minute."
        - alert: PodCrashLooping
          expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff"
            description: "Container {{ $labels.container }} keeps restarting."
