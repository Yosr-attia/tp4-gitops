apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - argocd-servicemonitors.yaml
  - alert-rules.yaml

# The Grafana sidecar loads every ConfigMap labelled grafana_dashboard=1
# -> the dashboard itself is versioned in Git (dashboards as code).
configMapGenerator:
  - name: gitops-overview-dashboard
    files:
      - dashboards/gitops-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
