apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-prod
resources:
  - ../../base
labels:
  - pairs:
      environment: prod
    includeSelectors: false

images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.16.0
replicas:
  - name: podinfo
    count: 3

patches:
  - path: patch-env.yaml
